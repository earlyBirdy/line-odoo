name: Terraform (OIDC)

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches: [ main ]
    paths:
      - "terraform/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [ dev ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform init
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform init

      - name: Terraform validate
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform plan -var-file=${{ matrix.env }}.tfvars -no-color

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [ dev ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform init
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform init

      - name: Terraform apply
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform apply -auto-approve -var-file=${{ matrix.env }}.tfvars
