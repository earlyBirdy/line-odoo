name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend unit tests (if present)
        working-directory: backend
        run: |
          if [ -d "tests" ]; then pytest -q; else echo "No tests/ directory, skipping pytest."; fi

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose up (smoke)
        run: |
          docker compose -f docker-compose.odoo-demo.yml up -d --build
          sleep 10
          docker compose -f docker-compose.odoo-demo.yml ps
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.odoo-demo.yml down -v
