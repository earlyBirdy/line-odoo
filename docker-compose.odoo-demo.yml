services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      # IMPORTANT:
      # If POSTGRES_DB is not set, Postgres will create a DB named equal to POSTGRES_USER (i.e. 'odoo').
      # That DB is NOT an initialized Odoo database and will cause /web/database/manager to 500 (ir.http missing).
      # So we explicitly set POSTGRES_DB=postgres to avoid creating a blank 'odoo' database.
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data

  odoo:
    image: odoo:18
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./odoo/addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo

volumes:
  odoo-db: