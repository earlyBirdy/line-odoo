version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    volumes:
      - redisdata:/data

  odoo:
    image: odoo:18
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      DB_NAME: odoo_staging
    command: >
      odoo
      --db_host=db
      --db_user=odoo
      --db_password=odoo
      --database=odoo_staging
    depends_on:
      db:
        condition: service_started
    volumes:
      - odoo_data:/var/lib/odoo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: line-odoo-backend
    build:
      context: ./backend
    environment:
      ODOO_BASE_URL: http://odoo:8069
      ODOO_DB: odoo_staging
    depends_on:
      odoo:
        condition: service_healthy
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.25
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/health.conf:/etc/nginx/conf.d/health.conf:ro
    ports:
      - "80:80"

volumes:
  pgdata:
  redisdata:
  odoo_data:
