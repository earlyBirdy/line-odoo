    worker_processes 1;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;

      # Rate limit for LINE webhook (防止重送/爆量)
      # 10 requests/sec per IP, burst 20
      limit_req_zone $binary_remote_addr zone=line_webhook:10m rate=10r/s;


      upstream odoo_upstream { server odoo:8069; }
      upstream backend_upstream { server backend:8000; }

      server {
        listen 80;

        # Liveness/Readiness for Nginx/ALB
        location = /health {
          add_header Content-Type text/plain;
          return 200 "ok\n";
        }


        # LINE webhook (exact) with rate limit
        location = /line/webhook {
          limit_req zone=line_webhook burst=20 nodelay;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://backend_upstream/line/webhook;
        }

        # LINE webhook (trailing slash) with rate limit
        location = /line/webhook/ {
          limit_req zone=line_webhook burst=20 nodelay;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://backend_upstream/line/webhook;
        }

        # Other /line/* routes
        location /line/ {
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_pass http://backend_upstream/;
        }

        location / {
          proxy_pass http://odoo_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 720s;
        }
      }
    }
